name: CI - Build, Scan, and Publish

on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    branches: [develop]

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.73.0

jobs:
  build-scan-publish:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, product-service, order-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (npm ci)
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy --version

      # M9 severity policy: report all severities for visibility, but only
      # fail the pipeline on CRITICAL. HIGH/MEDIUM/LOW are visible in logs
      # but do not block CI (see PROJECT_SCOPE.md M9 policy).
      - name: Trivy filesystem scan - full report
        run: |
          trivy fs --severity CRITICAL,HIGH,MEDIUM,LOW --exit-code 0 --ignorefile /dev/null services/${{ matrix.service }}

      - name: Trivy filesystem scan - policy gate (CRITICAL only)
        run: |
          trivy fs --severity CRITICAL --exit-code 1 --ignorefile "${{ github.workspace }}/.trivyignore" services/${{ matrix.service }}

      # --- Everything below is release-only. Per the corrected §4
      # release-promotion flow, feature/PR and plain develop pushes are
      # validation-only (tests + Trivy fs scan above) - only a push to a
      # release/* branch builds, scans, and publishes a deployable image. ---

      - name: Extract release version from branch name
        id: version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: echo "version=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      # Tagged twice: the release SemVer (e.g. v1.0.0) is the primary,
      # human-meaningful deployment version per §5/§12's own examples; the
      # git-sha tag is kept alongside it purely for exact traceability back
      # to the commit that was built, per this task's explicit instruction
      # not to remove it.
      - name: Build Docker image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          docker build \
            -t "trushangdev/devops-poc-${{ matrix.service }}:${{ steps.version.outputs.version }}" \
            -t "trushangdev/devops-poc-${{ matrix.service }}:${{ github.sha }}" \
            services/${{ matrix.service }}

      - name: Trivy image scan - full report
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          trivy image --severity CRITICAL,HIGH,MEDIUM,LOW --exit-code 0 --ignorefile /dev/null "trushangdev/devops-poc-${{ matrix.service }}:${{ steps.version.outputs.version }}"

      - name: Trivy image scan - policy gate (CRITICAL only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          trivy image --severity CRITICAL --exit-code 1 --ignorefile "${{ github.workspace }}/.trivyignore" "trushangdev/devops-poc-${{ matrix.service }}:${{ steps.version.outputs.version }}"

      # Docker Hub is only contacted on a release branch push - never from a
      # pull_request, and never from a plain develop push.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          docker push "trushangdev/devops-poc-${{ matrix.service }}:${{ steps.version.outputs.version }}"
          docker push "trushangdev/devops-poc-${{ matrix.service }}:${{ github.sha }}"

  # M10/M11 (corrected for the §4 release-promotion flow): once a release
  # branch push has published verified images to Docker Hub, bump the
  # GitOps repository's desired state to the released SemVer tag - not the
  # raw commit SHA - so Git always records an actual release, matching
  # §13's own example ("chore: deploy user-service v1.2.0"). The SHA tag is
  # still pushed to Docker Hub above for exact traceability, but the SemVer
  # tag is what ends up deployed. This remains the last CI-owned step in
  # the pipeline - per PROJECT_SCOPE.md §11/§14, GitHub Actions must never
  # deploy to Kubernetes directly; Argo CD reconciles this Git change onto
  # the cluster. This job never runs kubectl and never touches Minikube.
  update-gitops:
    name: Update GitOps repository
    needs: build-scan-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devops-poc-gitops (main)
        uses: actions/checkout@v4
        with:
          repository: trushang-dev/devops-poc-gitops
          ref: main
          token: ${{ secrets.GITOPS_REPO_TOKEN }}

      - name: Extract release version from branch name
        id: version
        run: echo "version=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      # yq is preinstalled on GitHub-hosted ubuntu-latest runners. Only
      # these two scalar fields are touched - every other value in the
      # file (probes, resources, hpa, per-service db config, comments) is
      # left byte-for-byte untouched.
      - name: Bump image repository/tag in Helm values
        run: |
          yq -i '.image.repository = "trushangdev"' helm/microservices/values.yaml
          yq -i '.image.tag = "${{ steps.version.outputs.version }}"' helm/microservices/values.yaml

      - name: Commit and push (only if the tag actually changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- helm/microservices/values.yaml; then
            echo "No change to helm/microservices/values.yaml - skipping commit."
          else
            git add helm/microservices/values.yaml
            git commit -m "chore: deploy devops-poc services ${{ steps.version.outputs.version }}"
            git push origin main
          fi
